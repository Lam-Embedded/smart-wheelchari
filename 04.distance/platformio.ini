[env:d1_mini_pro]
platform = espressif8266
board = d1_mini_pro
framework = arduino
monitor_speed = 115200
lib_deps = 
	knolleary/PubSubClient@^2.8
	briand/LibBriandIDF@^1.5.0
	gmag11/QuickEspNow@^0.8.1
	henriberisha/EasyEspNow@^1.0.0
